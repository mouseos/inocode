[package]
name = "inocode-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
dom_query = "0.29"
dom_smoothie = "0.19"
getrandom = "0.2"
html2text = "0.17"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strip-ansi-escapes = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
vt100 = "0.18"
zero-search = { git = "https://github.com/mouseos/ZeroSearch_MCP", rev = "7288401092daca571865f3a0419afc85acee9e14" }

[dev-dependencies]
tempfile = "3.27.0"
