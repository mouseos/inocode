[package]
name = "inocode-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zero-search = { git = "https://github.com/mouseos/ZeroSearch_MCP", rev = "9dc379ae6c49494c9e10baf1c403d93635d03380" }

[dev-dependencies]
tempfile = "3.27.0"
