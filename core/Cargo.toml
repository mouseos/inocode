[package]
name = "inocode-core"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
dom_query = "0.29"
flacenc = { version = "0.5", default-features = false }
dom_smoothie = "0.19"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
getrandom = "0.2"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
html2text = "0.17"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ignore = "0.4"
hayro = "0.9"
hmac = "0.12"
hound = "3.5"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
pdf-extract = "0.12"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rsa = { version = "0.9", features = ["sha2"] }
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strip-ansi-escapes = "0.2"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig", "yaml-load"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-language = "0.1"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-tags = "0.27"
tree-sitter-typescript = "0.23"
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
vt100 = "0.18"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
zero-search = { git = "https://github.com/mouseos/ZeroSearch_MCP", rev = "7288401092daca571865f3a0419afc85acee9e14" }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-async-persistent", "crypto-rust", "tokio"] }
libc = "0.2"
v4l = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
