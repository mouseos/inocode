name: protocol-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-test:
    name: protocol test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Build (release)
        shell: bash
        run: cargo build --release

      - name: TCP integration tests (release)
        shell: bash
        run: cargo test --release --test tcp_protocol
