name: protocol-test

on:
  workflow_dispatch:
    inputs:
      live:
        description: Also run the live provider tests, which spend the provider keys
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  protocol-test:
    name: protocol test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the ALSA headers (Linux sound recording)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Format check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy (release, warnings as errors)
        shell: bash
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Build (release)
        shell: bash
        run: cargo build --workspace --release

      - name: Tests (release, real TCP)
        shell: bash
        run: cargo test --workspace --release

  # The camera's automatic and manual modes on Linux, against the kernel's
  # virtual camera (vivid), whose gain has an automatic mode as UVC cameras do.
  virtual-camera:
    name: camera modes on a virtual camera (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the ALSA headers (Linux sound recording)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Load the virtual camera
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y v4l-utils
          # The runner's kernel ships vivid in its own modules package.
          sudo modprobe vivid n_devs=1 node_types=0x1
          sudo chmod a+rw /dev/video*
          v4l2-ctl --list-devices
          v4l2-ctl -d /dev/video0 --list-ctrls

      - name: Switch a mode and back
        shell: bash
        env:
          INOCODE_CAMERA_DEVICE: "0"
          INOCODE_CAMERA_CONTROL: gain
          INOCODE_CAMERA_VALUE: "77"
        run: |
          cargo test --release -p inocode-core --lib camera::tests::lists_the_cameras_here -- --ignored --exact --nocapture
          cargo test --release -p inocode-core --lib camera::tests::switches_a_mode_here -- --ignored --exact --nocapture

  live-api:
    name: live provider test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: protocol-test
    if: inputs.live
    strategy:
      fail-fast: false
      # One system at a time: the three share one provider key, and concurrent runs hit its rate limit.
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the ALSA headers (Linux sound recording)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      # The key is only read into an environment variable. It is never written
      # to a file or to the log, and the test prints generated text lengths only.
      # A missing key fails the job: an unexecuted live check is not a success.
      - name: Check the provider credential
        shell: bash
        env:
          LOGFARE_API_KEY: ${{ secrets.LOGFARE_API_KEY }}
        run: |
          if [ -z "${LOGFARE_API_KEY}" ]; then
            echo "::error::LOGFARE_API_KEY is not set, so the live provider test did not run."
            {
              echo "LOGFARE_API_KEY is not set, so the live provider check did not run."
              echo "This job failing means the live check was skipped, not passed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Live Logfare generation and streaming over TCP
        shell: bash
        env:
          LOGFARE_API_KEY: ${{ secrets.LOGFARE_API_KEY }}
        run: |
          set -o pipefail
          cargo test --release -p inocode-server --test live_api -- --ignored --nocapture --test-threads=1 | tee live-api.log
          found=0
          if grep -q "live logfare/auto:" live-api.log; then
            grep "live logfare/auto:" live-api.log >> "$GITHUB_STEP_SUMMARY"
            found=1
          fi
          if grep -q "live logfare/auto messages:" live-api.log; then
            grep "live logfare/auto messages:" live-api.log >> "$GITHUB_STEP_SUMMARY"
            found=1
          fi
          if [ "$found" -ne 1 ]; then
            echo "::error::No live test produced results, so the live check did not run."
            exit 1
          fi

      # The Messages live check against the official Anthropic API. Per project
      # decision only Haiku models are used. The credential is passed as
      # LOGFARE_API_KEY, the one environment variable the server reads. It runs
      # even when the Logfare step failed, so its result is always observable.
      - name: Live official Anthropic Messages generation and streaming over TCP
        if: always()
        shell: bash
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "${CLAUDE_API_KEY}" ]; then
            echo "::error::CLAUDE_API_KEY is not set, so the official Anthropic live check did not run."
            {
              echo "CLAUDE_API_KEY is not set, so the official Anthropic live check did not run."
              echo "This job failing means the live check was skipped, not passed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          LOGFARE_API_KEY="${CLAUDE_API_KEY}" \
          INOCODE_LLM_BASE_URL="https://api.anthropic.com" \
          INOCODE_LLM_PROVIDER="anthropic" \
          INOCODE_LLM_MODEL="claude-haiku-5-5" \
          cargo test --release -p inocode-server --test live_api logfare_messages_api_generates_and_streams_text_over_tcp -- --ignored --exact --nocapture --test-threads=1 | tee official-api.log
          if grep -q "live claude-haiku-5-5 messages:" official-api.log; then
            grep "live claude-haiku-5-5 messages:" official-api.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The official Anthropic live check produced no result line, so it did not run."
            exit 1
          fi
