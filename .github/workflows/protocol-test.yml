name: protocol-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-test:
    name: protocol test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Format check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy (release, warnings as errors)
        shell: bash
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Build (release)
        shell: bash
        run: cargo build --workspace --release

      - name: Tests (release, real TCP)
        shell: bash
        run: cargo test --workspace --release
