name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # Windows test threads overflow the default stack in debug builds.
  RUST_MIN_STACK: "67108864"

jobs:
  isolation:
    name: isolation guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_isolation.py

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcap-dev libssl-dev

      - name: Toolchain (pinned by codex-rs/rust-toolchain.toml)
        working-directory: codex-rs
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            codex-rs
            lib/zero-search

      - name: Crates changed by InoCode
        working-directory: codex-rs
        run: >
          cargo test --no-fail-fast
          -p codex-shell-command
          -p codex-zero-search-extension
          -p codex-utils-pty

      - name: Core unit tests for terminal monitor, tool list and exec policy
        working-directory: codex-rs
        run: cargo test --no-fail-fast -p codex-core --lib -- unified_exec tools::spec_plan exec_policy

      - name: ZeroSearch library
        working-directory: lib/zero-search
        run: cargo test --no-fail-fast -p zero-search
