[package]
name = "bing-mcp-provider"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Microsoft Bing search client library (web, video, news, suggestions) — derived from APK analysis of the Bing Android app, no API key or login required. Imported as `bing_search`; also powers the Bing_MCP server."
repository = "https://github.com/mouseos/ZeroSearch_MCP"

[lib]
name = "bing_search"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
scraper = "0.22"
url = "2"
