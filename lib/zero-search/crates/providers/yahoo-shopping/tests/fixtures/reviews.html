W9h7vpBE_tonMhqN-CKDsoEfsQk00", "maskYid": "tos********", "rating": 4, "title": "費用対効果がえげつないです", "body": "30%オフのクーポンで購入しました。\n1700円で、かつペイペイ祭りによって場合によっては30%近く帰ってきますので、実質1000円ぐらいで購入できます。\n\n発送も早く注文してから2.3ﾆ日で到着しました。\n包装もしっかりしており、ガス抜きもちゃんとありました。\n1年の賞味期限が切ってあるので、大量購入しても大丈夫です。\n\n味のほうですが、香りがやや強く、苦みがあります。その代わり酸味が少ない印象です。\n苦みが強いのは鮮度が悪いのをごまかすためにやや深入りしているからということもありますが、もともと苦みのある豆なのかもしれません。\n酸味のある豆とブレンドしてみましたが、さすがに酸味と苦みは喧嘩するようで、お勧めできません＾＾；\n\n自分は必ず牛乳を入れるので、この苦みに関してはあんまり気にならないのですが、妻はいまいちといった感じでした。\nしばらく酸味のあるコーヒーに慣れていたので、逆の味に慣れていなかったからかもしれません。\n\nとはいえ苦みも最初の一口だけで、2口目からやや苦みは薄まり、やや甘みを感じます。\n\n毎日何倍もコーヒーを飲むので、これだけの安いコーヒーですので、費用対効果はすさまじいと感じます。", "edited": false, "storeReply": [], "postedTime": 1637540414707, "referenceCount": 328, "subCodeOptions": [], "subReviews": [{"id": 29, "name": "香り", "valueId": 4, "valueName": "良い"}, {"id": 137, "name": "苦味", "valueId": 2, "valueName": "少し強い"}, {"id": 138, "name": "酸味", "valueId": 4, "valueName": "少し弱い"}], "profiles": [], "images": [], "videos": []}, {"id": "aab67242-6e7f-4631-b0c7-df12e25658a6", "ppid": "Q8mNfSy0Y_bpPKWxu7krw2hbP_bZGRWdtzEGDU5BTElDJkF700", "maskYid": "mas********", "rating": 5, "title": "30%オフのクーポンで購入しました。1…", "body": "30%オフのクーポンで購入しました。\n1700円で、かつペイペイ祭りによって場合によっては30%近く帰ってきますので、実質1000円ぐらいで購入できます。\n\n発送も早く注文してから2.3ﾆ日で到着しました。\n包装もしっかりしており、ガス抜きもちゃんとありました。\n1年の賞味期限が切ってあるので、大量購入しても大丈夫です。\n\n味のほうですが、香りがやや強く、苦みがあります。その代わり酸味が少ない印象です。\n苦みが強いのは鮮度が悪いのをごまかすためにやや深入りしているからということもありますが、もともと苦みのある豆なのかもしれません。\n酸味のある豆とブレンドしてみましたが、さすがに酸味と苦みは喧嘩するようで、お勧めできません＾＾；\n\n自分は必ず牛乳を入れるので、この苦みに関してはあんまり気にならないのですが、妻はいまいちといった感じでした。\nしばらく酸味のあるコーヒーに慣れていたので、逆の味に慣れていなかったからかもしれません。\n\nとはいえ苦みも最初の一口だけで、2口目からやや苦みは薄まり、やや甘みを感じます。\n\n毎日何倍もコーヒーを飲むので、これだけの安いコーヒーですので、費用対効果はすさまじいと感じます。\n", "edited": false, "storeReply": [], "postedTime": 1701231564601, "referenceCount": 141, "subCodeOptions": [{"name": "在庫", "value": "在庫"}, {"name": "種類", "value": "【0400003233953】豆のまま"}], "subReviews": [], "profiles": [], "images": [], "videos": []}, {"id": "cbe3b58b-2efb-4696-b2a1-962dc302e73e", "ppid": "2I5t0HInfpI0-4olJjIZUWCteRgyc-nNzId0-sTNtjPYYaHW00", "maskYid": "jil********", "rating": 1, "title": "完璧なリッチ・ブレンドなど存在しない。", "body": "「完璧なリッチ・ブレンドなんてものは存在しない。完璧な絶望が存在しないようにね」\n2kgの巨大な袋を抱えたとき、僕はかつての僕なら言わなかったであろう言葉を、心のなかでそっと呟いてみた。かつて、この『ドリップコーヒーファクトリー』の豆と僕との間には、ある種の沈黙の合意のようなものが存在していた。それは「安さ」という名の、非常にシンプルで、しかし強固な信頼関係だ。\nしかし、結局のところ、時間はすべてを摩耗させていく。\nまず、価格が上がった。かつての控えめだった彼らはどこへ行ったのか、今ではまるで人気急上昇中の若手ピアニストのように、いささか傲慢な数字を僕に突きつけてくる。\nそして肝心の味について語るなら、それは冬の午後の光の中に消えていく、遠い記憶の残像のようなものだ。正直に言って、そこらへんの駅のベンチで飲むドリップバッグの方が、まだ人生の重みを知っている。このコーヒーは、コーヒーという存在そのものというよりは、「かつてコーヒーだったものが、通り雨に打たれて薄まってしまった何か」に過ぎない。\n「リッチ」という名前の由来について、僕は真剣に考え込んでしまった。\n\n", "edited": true, "storeReply": [], "postedTime": 1772163358972, "referenceCount": 8, "subCodeOptions": [{"name": "在庫", "value": "在庫"}, {"name": "種類", "value": "【4571621610122】粉(中挽き)"}], "subReviews": [{"id": 29, "name": "香り", "valueId": 2, "valueName": "悪い"}, {"id": 137, "name": "苦味", "valueId": 5, "valueName": "弱い"}, {"id": 138, "name": "酸味", "valueId": 5, "valueName": "弱い"}], "profiles": [], "images": [{"url": "https://review-shopping.c.yimg.jp/images/dripcoffee_rrich-500-4/bb7dbfd3-7751-468a-9e90-d4fdafcbc23b.jpeg", "tagId": -1, "tagName": ""}], "videos": []}, {"id": "b237a931-7f57-4f67-a351-89619124688f", "ppid": "C_ai_1bDjVy0F3viO9n6QH13BG4uZ50KEtsc6PopkOELGW7500", "maskYid": "auc********", "rating": 1, "title": "とにかく全方位的に薄い", "body": "これまで何年かSA◯AIの珈琲豆(2kg)を愛飲してきましたが、価格高騰の理由によって少しお手頃なこちらを試しました。届いて箱を開けた瞬間にまず全く珈琲の香りが無いのにとても違和感を感じ〜ひとつ袋を開封しても香りは薄く〜念のため豆を細目に挽いてもう〜んという感じ。ハンドドリップ(アロマオイルを感じ易いステンレスネットを使用))をはじめてやっと多少の香りを感じるも、カップに注いで顔を近づけてもやはり感じられるものがなく、口をつけてみましたが香りも苦味も酸味も全てがとにかく薄くて...「コク・ボディと苦味」に振っているという商品説明と照らしてここまで不満足な珈琲ははじめてです。さてこの珈琲豆...どうしたものかと思いながら、家族や友人何人かに淹れてみましたが、誰もが同様の感想。\nこちらの口コミでは大半の方が肯定的な評価をつけていらっしゃることから考えて、お届けいただける豆のロットなどで当たり外れがあるのでしょうか？もしメーカーさんがご覧になっている様なら、この辺りの管理についてお聞かせいただきたいところです。\n", "edited": true, "storeReply": [], "postedTime": 1750579150294, "referenceCount": 8, "subCodeOptions": [{"name": "在庫", "value": "在庫"}, {"name": "種類", "value": "【4571621610115】豆のまま"}], "subReviews": [{"id": 29, "name": "香り", "valueId": 1, "valueName": "非常に悪い"}, {"id": 137, "name": "苦味", "valueId": 5, "valueName": "弱い"}, {"id": 138, "name": "酸味", "valueId": 5, "valueName": "弱い"}], "profiles": [], "images": [], "videos": []}, {"id": "b7bce629-0f96-43b8-b53e-53369a0aef6a", "ppid": "WvP5PyWpr44d185ugh0x1pU7KOa1xboqOb5XgQ9AgAdaHDU500", "maskYid": "yan********", "rating": 5, "title": "安い！美味しい！良い店を見つけました！！", "body": "今まで、毎年NO.1ショップの称号を獲得しているコーヒーショップで購入していたのですが、少し高額のため大セールのタイミングを狙って購入していました。\n昨今の物価高の影響かセール価格もいまいち安くならず、どうしようかと思っていたところ、こちらのショップを見つけて購入してみました。さっそく飲んでみたところ、とても美味しかったです。先のショップのコーヒーと比べても遜色ないです。\nあと、気に入ったのが、販売しているコーヒーの種類が多すぎないという事です。\n非常に多数の種類のコーヒーを販売して、商品ごとに「香り・コク・酸味・苦味」のチャートを表示しているのをよく目にするのですが、正直私には実際の感覚としてピンとこないと言うか、良く判りません。それに対し当店は、販売している８種類のコーヒーを一つのチャートで判りやすく表示しており、「今回購入したコーヒーが○○だから、もうちょっと甘めの物を・・・」という様に、自分好みのコーヒーを見つけやすいです。しかも、この安さなので、他のコーヒーを気軽に試してみる事が出来ます。\n", "edited": false, "storeReply": [], "postedTime": 1706372220412, "referenceCount": 36, "subCodeOptions": [{"name": "在庫", "value": "在庫"}, {"name": "種類", "value": "【0400003233960】粉(中挽き)"}], "subReviews": [], "profiles": [], "images": [], "videos": []}, {"id": "c782be61-c479-4434-a8e9-8936213f7bc4", "ppid": "S1TJbBLpXl8dHIRw1yKJ3isKT3nYYr9RTr8zxONRNP9LuwVq00", "maskYid": "fwr********", "rating": 4, "title": "ブラジル系の飲みやすいコーヒー豆", "body": "普段は200g 1,000円のコーヒーを常備しているのですが、30%のクーポンが当たったため、試しに購入しました。\nまだ1杯分しか飲んでいませんが、結論から申しますと、日常的に飲むコーヒーとしてはコスパがかなり良いと思います。\n\n飲み方としてはコーヒー豆20gを90度のお湯300ml、kalitaの3つ穴ペーパードリップで試しました。\nブラジルやベトナム産の豆なので、コーヒーのフレーバーとしては酸味が少なくて苦みが少しある豆になります。\nそのため、酸味が強いアフリカ系の豆が好きな方には合わないと思います。\n\n豆の品質は欠点豆が比較的に少ないと思います。\n\n過去に別の店でキロ単位でアイスコーヒー用の豆を購入した際には欠点豆が多くて臭いがきつかったため、2kgを購入するのに躊躇しましたが、概ね満足です。\n\nコンビニコーヒーと比較している方がいますが、コンビニは1杯100～150円程度なので、1杯数十円で作れる本商品を同じ土俵で比較するのはおかしいと思います・・・", "edited": false, "storeReply": [], "postedTime": 1637218327452, "referenceCount": 243, "subCodeOptions": [], "subReviews": [{"id": 29, "name": "香り", "valueId": 3, "valueName": "普通"}, {"id": 137, "name": "苦味", "valueId": 2, "valueName": "少し強い"}, {"id": 138, "name": "酸味", "valueId": 4, "valueName": "少し弱い"}], "profiles": [], "images": [], "videos": []}, {"id": "355cb44a-6cdb-429b-8ed9-0b22d45566c6", "ppid": "uJNn25cW2aUvmRtZEk0jRhYCvDczL2-rAPloc-zkPnC4fKvd00", "maskYid": "sak********", "rating": 3, "title": "袋を開けたら良い香りが広…", "body": "追記：星１つ減らします。昨日久しぶりにコンビニ(ファミマ)のアイスコーヒー飲んだら濃くて超美味しかった！→→→ここのは苦いだけです、ペーパーで落とすとよくわかりますが苦味も焦げた苦さというか、コンビニ珈琲の方が全然美味しかった。水出しで作るととても薄いので、ガブガブ飲んでも胃もたれせず、その飲み方なら良いかもしれません。ホットで飲むと味がもろにわかってしまうから、アイスで飲んだ方がマシと思う。\n\n袋を開けたら良い香りが広がりました。表の通り苦味のある豆です。夏はなるべくガスを使いたくなくて水出しコーヒーを作ってみました。水出しは薄くなりがちですが、酸味なく苦味もあり良いです。2キロでこの価格はありがたいです。ペーパーフィルターでホットでも作ってみましたが、酸味が全くないので苦味が目立ちます。酸味が嫌いなのでこの豆は理想的ですが、酸味も適度にあった方が柔らかくなるかなぁと思いました。私の場合は水出しコーヒーで飲むのがベストです。", "edited": true, "storeReply": [], "postedTime": 1628832794985, "referenceCount": 12, "subCodeOptions": [], "subReviews": [{"id": 29, "name": "香り", "valueId": 4, "valueName": "良い"}, {"id": 137, "name": "苦味", "valueId": 1, "valueName": "強い"}, {"id": 138, "name": "酸味", "valueId": 5, "valueName": "弱い"}], "profiles": [], "images": [], "videos": []}, {"id": "4877bff1-c52d-4536-ac25-fae82ccb7f06", "ppid": "ItjqsiH9OwyONun0zMmC7UgItwKBOK_SWvT8_SpQB8MiNya000", "maskYid": "ugk********", "rating": 1, "title": "商品説明と全く合致しない味わい", "body": "苦味強目のコーヒーが好きなので、DripCoffeeFactoryさんで扱っている豆の中で1番苦味が強くボディのしっかりしたこの豆を購入させて頂きましたが、結果から言うとかなり期待外れというか、もしかすると間違って別の豆を送られてしまったのではないかという感じです。焙煎についてまで商品説明に書かれておりませんが、味わいから想定されるのは深めの焙煎で、実際この豆は中煎り程度です。豆を見ればわかりますが、焙煎にもかなりムラが有ります。味わいも苦味はあまり主張なく、酸味をしっかり感じる良く言えばバランスの取れた味わい。これはこれでコーヒーとしてはOKなのですが商品説明とは全く合致しません。以前ドリップバッグに入ったものも購入させて頂きましたがこちらもちょっとイマイチで、今回も期待外れな豆だったので、個人的にもうDripCoffeeFactoryさんのリピートはないですね。申し訳有りません。", "edited": false, "storeReply": [], "postedTime": 1657354186126, "referenceCount": 27, "subCodeOptions": [{"name": "在庫", "value": "在庫"}, {"name": "種類", "value": "【0400003233953】豆のまま"}], "subReviews": [{"id": 29, "name": "香り", "valueId": 2, "valueName": "悪い"}, {"id": 137, "name": "苦味"
