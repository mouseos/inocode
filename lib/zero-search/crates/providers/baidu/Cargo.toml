[package]
name = "baidu-mcp-provider"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Baidu (百度) search client library — APK-derived (baiduboxapp) URL generation, server-issued pagination and structured parsing of wise result pages. No API key or login required. Imported as `baidu_search`; also powers the Baidu_MCP server."
repository = "https://github.com/mouseos/ZeroSearch_MCP"

[lib]
name = "baidu_search"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
aes = "0.8"
cbc = "0.1"
md5 = "0.7"
scraper = "0.22"
ego-tree = "0.10"
url = "2"
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
