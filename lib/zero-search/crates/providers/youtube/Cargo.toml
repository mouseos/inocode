[package]
name = "youtube-mcp-provider"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "YouTube client library reproducing the Android app's InnerTube API (search, video details, related videos, comments) — guest session only, no login. Imported as `youtube_search`."
repository = "https://github.com/mouseos/ZeroSearch_MCP"

[lib]
name = "youtube_search"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
# Kept on its own reqwest specification (not the workspace one): the
# standalone crate was live-verified with a rustls transport using
# the OS-native root store, and the client selects rustls explicitly
# (see client.rs) so workspace feature unification with the
# native-tls build used by the other providers cannot silently
# change this provider's TLS backend.
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots", "socks", "system-proxy"] }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
